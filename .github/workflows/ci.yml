name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: capstone
          POSTGRES_PASSWORD: capstone
          POSTGRES_DB: capstone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U capstone" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://capstone:capstone@localhost:5432/capstone
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../eval
      - name: Unit + integration tests (fixture corpus, hash encoder)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: api
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.names.outputs.prefix }}-api:latest,${{ steps.names.outputs.prefix }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.names.outputs.prefix }}-web:latest,${{ steps.names.outputs.prefix }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test the stack (hash encoder, fixture corpus)
        if: env.PUSH != 'true'
        run: |
          mkdir -p data/raw data/relations models
          cp backend/tests/fixtures/*.csv data/raw/ && cp -r backend/tests/fixtures/images data/raw/images
          cp backend/tests/fixtures/relations/*.csv data/relations/
          chmod -R a+rwX data models
          export ENCODER_BACKEND=hash
          docker compose up -d db
          docker run --rm --network image-retrieval_default -e ENCODER_BACKEND=hash \
            -e DATABASE_URL=postgresql://capstone:capstone@db:5432/capstone -v "$PWD/data:/data" \
            ${{ steps.names.outputs.prefix }}-api:latest python -m app.jobs.pipeline
          docker tag ${{ steps.names.outputs.prefix }}-api:latest image-retrieval-api:latest
          docker tag ${{ steps.names.outputs.prefix }}-web:latest image-retrieval-web:latest
          docker compose up -d --no-build api web
          for i in $(seq 1 30); do curl -fs localhost:8080/health/ready && break; sleep 2; done
          curl -fs localhost:8080/api/search -H 'content-type: application/json' -d '{"query":"ảnh Mỹ Tâm"}' | grep -q '"status":"ok"'
        env:
          COMPOSE_FILE: compose.yaml

  deploy:
    # Optional: set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (and DEPLOY_PATH) in the repo secrets
    # to pull the new images on a server and restart the stack after every push to main.
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TARGET: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Deploy over SSH
        if: env.HAS_TARGET == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '~/image-retrieval' }}
            git pull --ff-only
            docker compose -f compose.yaml -f compose.prod.yaml pull api web
            docker compose -f compose.yaml -f compose.prod.yaml up -d --no-build api web
      - name: No deploy target configured
        if: env.HAS_TARGET != 'true'
        run: echo "DEPLOY_HOST secret not set; skipping deploy."
